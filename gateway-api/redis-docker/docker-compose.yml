# 로컬 개발용 Redis. Gateway 와 워커가 같은 인스턴스를 봐야 한다.
# 비밀번호는 이 디렉터리의 .env 에서 읽는다 (gateway-api/.env 와 같은 값을 쓸 것).
services:
  redis:
    image: redis:7.4-alpine
    container_name: tts-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "30"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
